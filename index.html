<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>代禱管理中心 - TBC Serve</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react,react-dom"
        }
    }
    </script>
    <style type="text/tailwindcss">
        body { background-color: #f8fafc; font-family: "Noto Sans TC", sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Heart, Globe, Users, User, Plus, CheckCircle, Clock, Lock, ShieldAlert, LogIn, X } from 'lucide-react';

        const CATEGORIES = [
            { id: 'all', label: '全部', icon: Heart },
            { id: 'kingdom', label: '國度', icon: Globe },
            { id: 'outreach', label: '外展', icon: Users },
            { id: 'fellowship', label: '團契', icon: Users },
            { id: 'personal', label: '個人', icon: User },
        ];

        // 模擬資料庫
        const MOCK_PRAYERS = [
            { id: 1, type: 'kingdom', content: '為下週的普世宣教大會代禱。', status: 'published', isPrivate: false, date: '2026-10-23', author: '行政辦公室' },
            { id: 2, type: 'personal', content: '王弟兄即將進行手術，求主保守。', status: 'pending', isPrivate: true, date: '2026-10-22', author: '林小組長' }
        ];

        const PrayerApp = () => {
            // 狀態管理：登入狀態、權限、視圖模式
            const [session, setSession] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false); // 實際應用應從 Supabase user_roles 取得
            const [showLoginModal, setShowLoginModal] = useState(false);
            
            const [activeTab, setActiveTab] = useState('all');
            const [viewMode, setViewMode] = useState('board');
            const [prayers, setPrayers] = useState([]);
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                // 模擬公開讀取 API (無須 Session)
                setTimeout(() => {
                    setPrayers(MOCK_PRAYERS);
                    setIsLoading(false);
                }, 500);
            }, []);

            // 提報攔截邏輯
            const handleAddPrayerClick = () => {
                if (!session) {
                    setShowLoginModal(true);
                } else {
                    alert('開啟提報表單 Modal (已登入狀態)');
                }
            };

            // 模擬登入流程
            const handleMockLogin = (role) => {
                setSession({ user: { name: 'Test User' } });
                setIsAdmin(role === 'admin');
                setShowLoginModal(false);
            };

            const pendingCount = prayers.filter(p => p.status === 'pending').length;

            return (
                <div className="min-h-screen flex flex-col relative pb-24">
                    {/* 頂部導覽與登入狀態 */}
                    <header className="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center sticky top-0 z-40">
                        <a href="./index.html" className="font-bold text-slate-800 flex items-center gap-2">
                            <Heart className="text-rose-500" size={20} /> TBC Serve
                        </a>
                        <div>
                            {session ? (
                                <div className="text-sm font-semibold text-slate-600 flex items-center gap-3">
                                    <span>{isAdmin ? '管理員' : '會友'} 已登入</span>
                                    <button onClick={() => { setSession(null); setIsAdmin(false); setViewMode('board'); }} className="text-rose-600 hover:underline">登出</button>
                                </div>
                            ) : (
                                <button onClick={() => setShowLoginModal(true)} className="text-sm font-bold text-slate-600 hover:text-slate-900 flex items-center gap-1">
                                    <LogIn size={16} /> 登入
                                </button>
                            )}
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto w-full px-4 sm:px-6 py-8 animate-fade-in">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-8">
                            <div>
                                <h2 className="text-3xl font-black text-slate-900 tracking-tight">守望代禱</h2>
                                <p className="text-sm font-medium text-slate-500 mt-2">彼此相顧，激發愛心，勉勵行善</p>
                            </div>
                            <div className="flex gap-3 w-full sm:w-auto">
                                {isAdmin && (
                                    <button 
                                        onClick={() => setViewMode(viewMode === 'board' ? 'pending' : 'board')}
                                        className="relative flex-1 sm:flex-none px-4 py-2.5 rounded-xl text-sm font-bold border-2 bg-indigo-50 border-indigo-200 text-indigo-700"
                                    >
                                        {viewMode === 'pending' ? '返回佈告欄' : '審核收件匣'}
                                        {pendingCount > 0 && viewMode === 'board' && (
                                            <span className="absolute -top-2 -right-2 w-6 h-6 bg-rose-500 text-white text-xs flex items-center justify-center rounded-full font-black shadow-sm">{pendingCount}</span>
                                        )}
                                    </button>
                                )}
                                <button onClick={handleAddPrayerClick} className="flex-1 sm:flex-none bg-rose-600 hover:bg-rose-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform">
                                    <Plus size={18} strokeWidth={2.5} /> 提報代禱
                                </button>
                            </div>
                        </div>

                        {/* 分類標籤 (僅佈告欄顯示) */}
                        {viewMode === 'board' && (
                            <div className="flex overflow-x-auto no-scrollbar gap-2 mb-6 pb-2 -mx-4 px-4 sm:mx-0 sm:px-0">
                                {CATEGORIES.map(cat => (
                                    <button
                                        key={cat.id}
                                        onClick={() => setActiveTab(cat.id)}
                                        className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all border-2 ${
                                            activeTab === cat.id ? 'bg-slate-800 border-slate-800 text-white' : 'bg-white border-slate-100 text-slate-500'
                                        }`}
                                    >
                                        <cat.icon size={16} className={activeTab === cat.id ? "text-rose-400" : ""} /> {cat.label}
                                    </button>
                                ))}
                            </div>
                        )}

                        {/* 列表渲染區 */}
                        <div className="flex flex-col gap-4">
                            {prayers
                                .filter(p => viewMode === 'pending' ? p.status === 'pending' : p.status === 'published')
                                .filter(p => (activeTab === 'all' || p.type === activeTab) && viewMode === 'board' ? true : viewMode === 'pending')
                                .map(prayer => (
                                    <div key={prayer.id} className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
                                        <div>
                                            <div className="flex justify-between mb-3">
                                                <div className="flex gap-2">
                                                    <span className="text-xs font-black px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600">{CATEGORIES.find(c => c.id === prayer.type)?.label}</span>
                                                    {prayer.isPrivate && <span className="flex items-center gap-1 text-[11px] font-bold text-slate-500 bg-slate-50 px-2 rounded-lg"><Lock size={12}/>限同工</span>}
                                                </div>
                                                <span className="text-xs text-slate-400">{prayer.date}</span>
                                            </div>
                                            <p className="text-slate-800 font-medium mb-4">{prayer.content}</p>
                                        </div>
                                        <div className="flex justify-between items-center pt-3 border-t border-slate-50 text-xs text-slate-400">
                                            <span>提報：{prayer.author}</span>
                                            {viewMode === 'pending' && isAdmin && (
                                                <button className="px-3 py-1.5 rounded-lg font-bold text-white bg-emerald-600 flex items-center gap-1">
                                                    <CheckCircle size={14}/> 核准
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                        </div>
                    </main>

                    {/* 漸進式登入攔截 Modal */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-xl relative">
                                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <X size={20} />
                                </button>
                                <div className="text-center mb-6">
                                    <div className="w-12 h-12 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-3"><Lock size={24} /></div>
                                    <h3 className="text-xl font-black text-slate-900">需要登入</h3>
                                    <p className="text-sm text-slate-500 mt-2">為了保護代禱資訊安全，新增事項前請先登入系統。</p>
                                </div>
                                <div className="space-y-3">
                                    <button onClick={() => handleMockLogin('user')} className="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-900">以 會友 身份登入</button>
                                    <button onClick={() => handleMockLogin('admin')} className="w-full bg-indigo-50 text-indigo-700 font-bold py-3 rounded-xl hover:bg-indigo-100">以 管理員 身份登入</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<PrayerApp />);
    </script>
</body>
</html>
