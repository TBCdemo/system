<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>場地預約登記系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const INITIAL_RESERVATIONS = [
      { id: '1', eventName: '小組餐敘', roomName: '副堂', date: '2026-10-24', startTime: '18:00', endTime: '20:00', unit: '春雨小組', contactPerson: '張禮南' },
      { id: '2', eventName: '主日學', roomName: '大堂', date: '2026-10-24', startTime: '10:00', endTime: '12:00', unit: '教育組', contactPerson: '蔡愛珍' }
    ];

    function App() {
      const [selectedDate, setSelectedDate] = useState('2026-10-24');
      const [selectedRoom, setSelectedRoom] = useState('大堂');
      const [reservations, setReservations] = useState(INITIAL_RESERVATIONS);
      const [isOpen, setIsOpen] = useState(false);
      const [formData, setFormData] = useState({
        eventName: '', roomName: '大堂', date: '2026-10-24', startTime: '14:00', endTime: '16:00', unit: '', contactPerson: ''
      });

      const conflict = useMemo(() => {
        return reservations.find(r => 
          r.date === formData.date &&
          r.roomName === formData.roomName &&
          (formData.startTime < r.endTime && formData.endTime > r.startTime)
        );
      }, [formData, reservations]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (conflict) return;
        setReservations([...reservations, { id: String(Date.now()), ...formData }]);
        setIsOpen(false);
      };

      const dailyBookings = reservations.filter(r => r.date === selectedDate && r.roomName === selectedRoom);

      return (
        <div className="max-w-xl mx-auto p-4">
          <div className="flex justify-between items-center mb-4">
            <h1 className="text-xl font-bold">場地預約系統</h1>
            <button 
              onClick={() => { setFormData({ ...formData, roomName: selectedRoom, date: selectedDate }); setIsOpen(true); }}
              className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-700"
            >
              + 新預約
            </button>
          </div>

          {/* 控制列 */}
          <div className="bg-white p-3 rounded-xl border border-slate-200 mb-4 flex justify-between items-center">
            <input 
              type="date" 
              value={selectedDate} 
              onChange={e => setSelectedDate(e.target.value)}
              className="font-semibold text-slate-800 border-0 cursor-pointer"
            />
            <div className="flex bg-slate-100 p-1 rounded-lg">
              {['大堂', '副堂'].map(room => (
                <button
                  key={room}
                  onClick={() => setSelectedRoom(room)}
                  className={`px-3 py-1 text-xs font-semibold rounded-md ${selectedRoom === room ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600'}`}
                >
                  {room}
                </button>
              ))}
            </div>
          </div>

          {/* 預約清單 */}
          <div className="space-y-2">
            {dailyBookings.length === 0 ? (
              <p className="text-center py-8 text-slate-400 text-sm">今日尚無借用記錄</p>
            ) : (
              dailyBookings.map(item => (
                <div key={item.id} className="p-3 bg-white border border-slate-200 rounded-xl flex justify-between items-center">
                  <div>
                    <span className="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{item.startTime} - {item.endTime}</span>
                    <h3 className="font-semibold text-slate-800 mt-1">{item.eventName}</h3>
                    <p className="text-xs text-slate-400">{item.unit} · {item.contactPerson}</p>
                  </div>
                  <span className="text-xs text-emerald-600 font-medium">已同步</span>
                </div>
              ))
            )}
          </div>

          {/* 彈出視窗 */}
          {isOpen && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4">
              <form onSubmit={handleSubmit} className="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3">
                <h2 className="font-bold text-base">新增場地預約</h2>
                {conflict && (
                  <div className="p-2 bg-rose-50 text-rose-700 text-xs rounded border border-rose-200">
                    時段與「{conflict.eventName}」衝突 ({conflict.startTime}-{conflict.endTime})
                  </div>
                )}
                <div>
                  <label className="text-xs text-slate-500">活動名稱</label>
                  <input required type="text" value={formData.eventName} onChange={e => setFormData({...formData, eventName: e.target.value})} className="w-full border p-2 rounded text-sm" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs text-slate-500">開始時間</label>
                    <input type="time" value={formData.startTime} onChange={e => setFormData({...formData, startTime: e.target.value})} className="w-full border p-2 rounded text-sm" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-500">結束時間</label>
                    <input type="time" value={formData.endTime} onChange={e => setFormData({...formData, endTime: e.target.value})} className="w-full border p-2 rounded text-sm" />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs text-slate-500">借用單位</label>
                    <input type="text" value={formData.unit} onChange={e => setFormData({...formData, unit: e.target.value})} className="w-full border p-2 rounded text-sm" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-500">聯絡人</label>
                    <input required type="text" value={formData.contactPerson} onChange={e => setFormData({...formData, contactPerson: e.target.value})} className="w-full border p-2 rounded text-sm" />
                  </div>
                </div>
                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={() => setIsOpen(false)} className="flex-1 py-2 text-sm border rounded-lg text-slate-600">取消</button>
                  <button type="submit" disabled={Boolean(conflict)} className={`flex-1 py-2 text-sm rounded-lg text-white ${conflict ? 'bg-slate-300' : 'bg-blue-600'}`}>確認預約</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
